<svg width="1100" height="150" viewBox="0 0 1100 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ghost in the machine">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07070B"/>
      <stop offset="1" stop-color="#150409"/>
    </linearGradient>
    <linearGradient id="fedge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#DC143C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DC143C"/>
      <stop offset="1" stop-color="#DC143C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes breathe { 0%,100% { opacity:.5 } 50% { opacity:1 } }
    .c { animation:blink 1.1s step-end infinite }
    .e { animation:breathe 4.5s ease-in-out infinite }
    text { font-family:'Cascadia Code','Fira Code',Consolas,'Courier New',monospace }
  </style>
  <rect width="1100" height="150" fill="url(#fbg)"/>
  <rect class="e" width="1100" height="2" fill="url(#fedge)"/>
  <text x="550" y="68" text-anchor="middle" font-size="18" letter-spacing="4" fill="#E5E7EB">「 ghost in the machine 」</text>
  <text x="550" y="104" text-anchor="middle" font-size="13" letter-spacing="2" fill="#6B7280">IMPULSE69 — BUILT WITH MIDNIGHT ENERGY<tspan class="c" fill="#DC143C"> ▊</tspan></text>
</svg>
